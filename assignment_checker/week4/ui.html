<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業檢查助手 · 補件工作台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#192e40;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}header{background:#152f43;color:white;padding:24px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}header span{color:#c0d4df;font-size:13px}main{max-width:1168px;margin:38px auto;padding:0 24px}.eyebrow{color:#567483;letter-spacing:2px;font-size:12px;font-weight:700}h1{font-size:32px;margin:10px 0 12px}p{line-height:1.7;color:#5c6d7c}section{display:grid;grid-template-columns:380px 1fr;gap:24px;margin:28px 0}.card{background:white;border:1px solid #dae3e9;border-radius:16px;padding:28px;box-shadow:0 6px 16px #1e3f5910}h2{font-size:20px;margin:0 0 20px}label{display:block;font-size:14px;font-weight:600;margin:18px 0 8px}textarea,select{font:inherit;width:100%;border:1px solid #c7d3dc;background:#fbfcfd;border-radius:8px;padding:12px}textarea{resize:vertical;min-height:140px;line-height:1.7}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 16px;font-weight:600;background:#146858;color:white}button.secondary{background:#edf3f6;color:#213e52}button.danger{background:#f4e7e5;color:#942f29}button:disabled{cursor:wait;opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.tag{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;color:#315d70;background:#eaf2f6}.row{padding:17px 0;border-bottom:1px solid #e8edf0;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}.row strong{font-size:15px}.row small{display:block;color:#687f8c;margin-top:6px;line-height:1.6}.status{white-space:nowrap;font-size:12px;padding:5px 10px;border-radius:8px;background:#eaf3ed;color:#246343}.status.partial,.status.uncertain{background:#fff2d5;color:#855d08}.notice{padding:16px 18px;background:#f0f6f5;border-left:3px solid #146858;border-radius:6px;line-height:1.8;margin:20px 0}.error{background:#fbeeea;color:#922f28;border-color:#b04632}.muted{font-size:13px;color:#748795}.empty{padding:46px 12px;text-align:center;color:#78909d}.empty div{font-size:32px;margin-bottom:18px}details{margin-top:24px}summary{cursor:pointer;color:#5c7688;font-size:13px}pre{background:#f5f8fa;padding:15px;overflow:auto;font-size:11px;max-height:300px;white-space:pre-wrap;word-break:break-all}.hidden{display:none}#receipt{word-break:break-word}footer{border-top:1px solid #dce5ea;padding:20px 0;font-size:12px;color:#6d8190}@media(max-width:800px){section{grid-template-columns:1fr}h1{font-size:27px}header span{display:none}.card{padding:22px}main{margin-top:26px}}
</style></head><body><header><b>作業檢查助手</b><span>NUTN · TEAM 02 · WEEK 04</span></header><main><div class="eyebrow">提交之後，再確認一次</div><h1>少了什麼，清楚知道。</h1><p>對照老師已確認的要求，查看缺漏與待確認項目。補件清單會先讓你確認，再存成草稿。</p><section>
<div class="card"><h2>這次要檢查的作業</h2><span class="tag">合成示範資料 · 不含真實學生作業</span><label for="submission">作業版本</label><select id="submission"><option>SUB-DEMO-01 ／ 第 1 版</option></select><label for="message">告訴助手你需要什麼</label><textarea id="message">檢查這份作業，幫我整理需要補充與待確認的內容，再準備補件清單草稿。</textarea><label for="mode">執行方式</label><select id="mode"><option value="live">OpenAI 實際 AI（使用專案 API 額度）</option><option value="fixture">離線示範（不呼叫模型）</option></select><div class="actions"><button id="draft" type="button">準備補件清單</button><button class="secondary" id="read" type="button">只看缺漏</button></div><p class="muted">草稿只儲存在本機。老師與學生尚不會收到外部通知。</p></div>
<div class="card" aria-live="polite"><h2>檢查結果 <span id="badge" class="tag">尚未開始</span></h2><div id="runmode" class="muted"></div><div id="empty" class="empty"><div>☷</div>完成查詢後，這裡會顯示<br>已完成、需補件與待確認的內容。</div><div id="items"></div><div id="notice" class="notice hidden"></div><div id="decision" class="hidden"><h2>確認建立這份補件清單？</h2><p>包含上方的「需補件」與「待確認」項目，對象為第 1 版提交。</p><div class="actions"><button id="accept" type="button">確認建立草稿</button><button class="danger" id="decline" type="button">取消，不建立</button></div></div><div id="receipt" class="muted"></div><details id="debug" class="hidden"><summary>查看執行紀錄與來源引用</summary><pre id="trace"></pre></details></div>
</section><footer>本機教學版本 · 判斷結果仍由老師確認 · <a href="/docs">API 文件</a></footer></main>
<script>
let runId=null,busy=false;const $=id=>document.getElementById(id);const words={met:'已完成',partial:'需補件',missing:'缺少內容',uncertain:'待確認'};const states={starting:'處理中',awaiting_confirmation:'等待確認',completed:'已完成',declined:'已取消',written:'草稿已儲存',stopped:'已停止'};
function lock(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
function notice(text,error=false){$('notice').textContent=text;$('notice').className='notice'+(error?' error':'')}
function render(run){runId=run.run_id;$('runmode').textContent=run.request.mode==='live'?'本次結果：OpenAI 實際 AI · '+run.live_status:'本次結果：離線示範，未呼叫 LLM';sessionStorage.setItem('week4-run',runId);$('badge').textContent=states[run.state]||run.state;$('empty').classList.add('hidden');$('items').replaceChildren();
for(const item of run.report?.items||[]){const row=document.createElement('div');row.className='row';const left=document.createElement('div'),title=document.createElement('strong'),small=document.createElement('small'),badge=document.createElement('span');title.textContent=item.label;small.textContent=item.citations.map(c=>c.chunk_id+'：'+c.quote).join('\n');badge.textContent=words[item.value]||item.value;badge.className='status '+item.value;left.append(title,small);row.append(left,badge);$('items').append(row)}
$('decision').classList.toggle('hidden',run.state!=='awaiting_confirmation');$('receipt').textContent=run.receipt?'草稿編號：'+run.receipt.draft_id+'\n請求編號：'+run.run_id:'';
if(run.state==='awaiting_confirmation')notice('提案已準備好，尚未建立補件草稿。');else if(run.state==='declined')notice('已取消這次提案，沒有建立補件草稿。');else if(run.receipt)notice(run.error?'草稿已儲存；AI 摘要未完成，請以上方實際結果為準。':'補件草稿已建立，尚未傳送給任何人。',!!run.error);else if(run.error)notice('這次已停止：'+run.error.code+'。沒有建立補件草稿。',true);else notice('缺漏查詢完成，未建立補件草稿。');
$('debug').classList.remove('hidden');$('trace').textContent=JSON.stringify({run_id:run.run_id,mode:run.request.mode,live_status:run.live_status,summary:run.summary,audit:run.audit,mcp_trace:run.mcp_trace},null,2)}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||data.detail||'輸入格式有誤');return data}
async function start(intent){if(busy)return;lock(true);$('decision').classList.add('hidden');$('badge').textContent='處理中';notice('正在讀取報告並核對證據，請稍候…');try{render(await request('/assistant/week4/runs',{assignment_id:'HW-DEMO-01',submission_id:'SUB-DEMO-01',submission_version:1,message:$('message').value,intent,mode:$('mode').value}))}catch(e){notice(String(e.message),true)}finally{lock(false)}}
async function decide(accepted){if(busy||!runId)return;lock(true);try{render(await request('/assistant/week4/runs/'+runId+'/decision',{accepted}))}catch(e){notice('結果尚不明確，請重新整理查詢這筆請求；不要建立新提案。',true)}finally{lock(false)}}
$('draft').onclick=()=>start('draft');$('read').onclick=()=>start('read');$('accept').onclick=()=>decide(true);$('decline').onclick=()=>decide(false);
const saved=sessionStorage.getItem('week4-run');if(saved)fetch('/assistant/week4/runs/'+saved).then(r=>r.ok?r.json():null).then(r=>r&&render(r)).catch(()=>{});
</script></body></html>
